# ================================================================
# 用户服务接口测试 - 精简 CI 示例
#
# 只做两件事：
#   1. 在真实的 PostgreSQL 容器中运行接口集成测试（tests/integration）
#   2. 构建用户服务 Docker 镜像（仅构建，不推送）
#
# 触发条件：push / PR 到 main 分支
# ================================================================

name: API Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ==================== 运行测试 ====================
  test:
    name: 运行测试
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres123
          POSTGRES_DB: user_db_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d user_db_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: services/user-service/requirements.txt

      - name: 安装依赖
        working-directory: services/user-service
        run: pip install -r requirements.txt

      - name: 运行接口集成测试
        working-directory: services/user-service
        env:
          DATABASE_URL: postgresql://postgres:postgres123@localhost:5432/user_db_test
          USER_DB_SCHEMA: user_service_test
          JWT_SECRET_KEY: ci-test-secret-key
          JWT_ALGORITHM: HS256
          CONSUL_ENABLED: "false"
          LOG_LEVEL: WARNING
        run: python -m pytest tests/integration -v --tb=short

  # ==================== 构建镜像 ====================
  build-image:
    name: 构建用户服务镜像
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 构建 Docker 镜像
        run: docker build -t user-service:ci-${{ github.sha }} ./services/user-service

      - name: 验证镜像内应用可导入
        run: docker run --rm user-service:ci-${{ github.sha }} python -c "import app.main; print('image ok')"
